<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Color Changer</title>

<body>

            let value = "#";

            for (let i = 0; i < 6; i++) {

                const randomIndex =
                    Math.floor(Math.random() * colors.length);

                value += colors[randomIndex];
            }

            body.style.background = value;

            text.textContent = value;
        }

    </script>

</body>
</html>
